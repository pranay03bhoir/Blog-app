name: Blog-app

on:
  push:
    branches: main

env:
  APP_NAME: blogapp-fullstack
  CONTAINER_NAME: springboot-container
  MYSQL_CONTAINER_NAME: mysql-container
  MYSQL_DATABASE: blog_app
  MYSQL_ROOT_PASSWORD: pranay123
  IMAGE-TAG: ${{github.sha}}

jobs:
  build-and-deploy:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout code
        uses: actions/checkout@v3

      - name: Setup Java
        uses: actions/setup-java@v5
        with:
          java-version: 25
          distribution: temurin
          cache: maven

      - name: Build Application
        run: ./mvnw clean package -DskipTests
      #      - name: Set up Docker Buildx
      #        uses: docker/setup-buildx-action@v2

      - name: Log in to DockerHub
        uses: docker/login-action@v4
        with:
          username: ${{ vars.DOCKER_USERNAME }}
          password: ${{ secrets.DOCKER_PASSWORD }}

      - name: Build Docker images
        run: |
          docker build \
          -t ${{vars.DOCKER_USERNAME}}/${{env.APP_NAME}}:${{env.IMAGE_TAG}} \
          .
          echo "Docker image built: ${{vars.DOCKER_USERNAME}}/${{env.APP_NAME}}:${{env.IMAGE_TAG}}"

      - name: Push Docker Image
        run: |
          docker push ${{vars.DOCKER_USERNAME}}/${{env.APP_NAME}}:${{env.IMAGE_TAG}}
          echo "Docker image pushed to DockerHub: ${{vars.DOCKER_USERNAME}}/${{env.APP_NAME}}:${{env.IMAGE_TAG}}"

      - name: Deploy to EC2
        uses: appleboy/ssh-action@v1.2.2
        with:
          host: ${{vars.AWS_EC2_HOST}}
          username: ${{vars.AWS_EC2_USER}}
          key: ${{secrets.AWS_EC2_PASSWORD}}
          script: |
            docker pull mysql
            docker stop ${{env.MYSQL_CONTAINER_NAME}}
            docker run -d \
            --name ${{env.MYSQL_CONTAINER_NAME}} \
            -e MYSQL_ROOT_PASSWORD=${{env.MYSQL_ROOT_PASSWORD}} \
            -e MYSQL_DATABASE=${{env.MYSQL_DATABASE}} \
            -p 3306:3306 mysql
            docker image prune -f
            docker pull ${{vars.DOCKER_USERNAME}}/${{env.APP_NAME}}:${{env.IMAGE_TAG}}
            docker stop ${{env.CONTAINER_NAME}} || true
            docker rm ${{env.CONTAINER_NAME}} || true
            docker run -d \
                                   --name ${{env.CONTAINER_NAME}} \
                                    -p 8080:8080  \
                                    ${{vars.DOCKER_USERNAME}}/${{env.APP_NAME}}:${{env.IMAGE_TAG}}
                                  docker image prune -f
                                  echo "Deployment completed on EC2: ${{vars.AWS_EC2_HOST}}"