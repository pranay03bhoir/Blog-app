<!DOCTYPE html>
<html xmlns:th="http://www.thymeleaf.org">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=5.0">
    <title th:text="${category.name} + ' - BlogApp Pro'">Category - BlogApp Pro</title>
    <link rel="preconnect" href="https://fonts.googleapis.com">
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
    <link href="https://fonts.googleapis.com/css2?family=Plus+Jakarta+Sans:wght@400;500;600;700;800&family=JetBrains+Mono:wght@400;500&display=swap" rel="stylesheet">
    <link rel="icon" type="image/svg+xml" th:href="@{/favicon.svg}">
    <link rel="alternate icon" th:href="@{/favicon.ico}">
    <link rel="stylesheet" th:href="@{/css/style.css}">
</head>
<body>

    <div th:replace="~{layout/navbar :: navbar}"></div>

    <main class="main-content">
        <div class="container">

            <!-- Category Header -->
            <div class="taxonomy-header">
                <span class="badge badge-category" style="margin-bottom: 0.75rem;">Category</span>
                <h1 th:text="${category.name}">Category Name</h1>
                <p th:text="${category.description ?: 'Curated articles in ' + category.name}">Category description</p>
                <div style="margin-top: 1rem; color: var(--text-muted); font-size: 0.88rem;">
                    <strong style="color: #fff;" th:text="${articles.totalElements}">0</strong> stories published
                </div>
            </div>

            <!-- Articles Grid -->
            <div class="articles-grid">
                <article class="article-card" th:each="art : ${articles.content}">
                    <div class="article-card-body">
                        <div class="article-card-meta">
                            <span th:text="${art.readingMinutes + ' min read'}">3 min read</span>
                            <span>•</span>
                            <span th:text="${art.publishedAt != null ? #temporals.format(art.publishedAt, 'MMM dd, yyyy') : 'Recently'}">Date</span>
                        </div>
                        <h3 class="article-card-title">
                            <a th:href="@{/articles/{slug}(slug=${art.slug ?: art.id})}" th:text="${art.title}">Title</a>
                        </h3>
                        <p class="article-card-desc" th:text="${art.shortDesc}">Description</p>
                        <div class="article-card-footer">
                            <div class="author-chip" th:if="${art.user != null}">
                                <div class="author-avatar" th:text="${#strings.substring(art.user.name, 0, 1)}">U</div>
                                <span th:text="${art.user.name}">Author</span>
                            </div>
                            <div class="article-stats">
                                <span>👁️ <span th:text="${art.viewsCount}">0</span></span>
                                <span>❤️ <span th:text="${art.likesCount}">0</span></span>
                            </div>
                        </div>
                    </div>
                </article>
            </div>

        </div>
    </main>

    <div th:replace="~{layout/footer :: footer}"></div>

    <script th:src="@{/js/app.js}"></script>
</body>
</html>
