<!DOCTYPE html>
<html xmlns:th="http://www.thymeleaf.org">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title th:text="${isEdit} ? 'Edit Story - BlogApp Pro' : 'New Story - BlogApp Pro'">Story Editor - BlogApp Pro</title>
    <link rel="preconnect" href="https://fonts.googleapis.com">
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
    <link href="https://fonts.googleapis.com/css2?family=Plus+Jakarta+Sans:wght@400;500;600;700;800&family=JetBrains+Mono:wght@400;500&display=swap" rel="stylesheet">
    <link rel="icon" type="image/svg+xml" th:href="@{/favicon.svg}">
    <link rel="alternate icon" th:href="@{/favicon.ico}">
    <link rel="stylesheet" th:href="@{/css/style.css}">
    <script src="https://cdn.jsdelivr.net/npm/marked/marked.min.js"></script>
</head>
<body>

    <div th:replace="~{layout/navbar :: navbar}"></div>

    <main class="main-content">
        <div class="container">

            <div style="display: flex; justify-content: space-between; align-items: center; margin-bottom: 1.5rem;">
                <h1 style="font-size: 1.75rem;" th:text="${isEdit} ? 'Edit Story' : 'Draft New Story'">Draft New Story</h1>
                <div style="display: flex; gap: 0.75rem;">
                    <button type="button" onclick="saveArticle('DRAFT')" class="btn btn-secondary">Save Draft</button>
                    <button type="button" onclick="saveArticle('PUBLISHED')" class="btn btn-primary">Publish Story 🚀</button>
                </div>
            </div>

            <!-- Meta settings bar -->
            <div style="background: var(--bg-surface); border: 1px solid var(--border-color); border-radius: var(--radius-md); padding: 1.5rem; margin-bottom: 1.5rem;">
                <div style="display: grid; grid-template-columns: 1.5fr 1fr; gap: 1.5rem; margin-bottom: 1.25rem;">
                    <div>
                        <label class="form-label">Story Title *</label>
                        <input type="text" id="article-title" class="form-input" placeholder="Give your story a clear title..." th:value="${article.title}" required />
                    </div>
                    <div>
                        <label class="form-label">Category</label>
                        <select id="article-category" class="form-select">
                            <option value="">Select a Category...</option>
                            <option th:each="cat : ${categories}" 
                                    th:value="${cat.id}" 
                                    th:text="${cat.name}" 
                                    th:selected="${article.category != null && article.category.id == cat.id}">Category</option>
                        </select>
                    </div>
                </div>

                <div style="margin-bottom: 1.25rem;">
                    <label class="form-label">Subtitle / Short Summary</label>
                    <input type="text" id="article-shortDesc" class="form-input" placeholder="A brief 1-2 sentence preview for feed cards..." th:value="${article.shortDesc}" />
                </div>

                <div style="display: grid; grid-template-columns: 1fr 1fr; gap: 1.5rem;">
                    <div>
                        <label class="form-label">Tags (comma separated)</label>
                        <input type="text" id="article-tags" class="form-input" placeholder="e.g. springboot, docker, microservices" 
                               th:value="${article.tags != null ? #strings.arrayJoin(article.tags.![name], ', ') : ''}" />
                    </div>
                    <div>
                        <label class="form-label">Cover Image (Upload or URL)</label>
                        <div style="display: flex; gap: 0.5rem;">
                            <input type="text" id="article-coverUrl" class="form-input" placeholder="https://... or uploaded image" th:value="${article.coverImageUrl}" />
                            <label class="btn btn-secondary btn-sm" style="white-space: nowrap; cursor: pointer;">
                                📁 Upload
                                <input type="file" id="cover-file-input" style="display: none;" accept="image/*" onchange="uploadCoverImage(this)" />
                            </label>
                        </div>
                    </div>
                </div>
            </div>

            <!-- Editor & Live Markdown Preview Layout -->
            <div class="editor-layout">
                <div class="editor-pane">
                    <div style="font-size: 0.85rem; font-weight: 600; color: var(--text-muted); margin-bottom: 0.5rem; display: flex; justify-content: space-between;">
                        <span>MARKDOWN CONTENT</span>
                        <span>Supports # Headers, **bold**, `code`, etc.</span>
                    </div>
                    <textarea id="article-content" class="editor-textarea" placeholder="Write your story in Markdown here..." oninput="updateLivePreview()" th:text="${article.content}"></textarea>
                </div>

                <div>
                    <div style="font-size: 0.85rem; font-weight: 600; color: var(--text-muted); margin-bottom: 0.5rem;">
                        LIVE PREVIEW
                    </div>
                    <div id="editor-preview" class="preview-pane article-content">
                        <p style="color: var(--text-muted);">Start writing on the left to see the live rendering here...</p>
                    </div>
                </div>
            </div>

        </div>
    </main>

    <div th:replace="~{layout/footer :: footer}"></div>

    <script th:src="@{/js/app.js}"></script>
    <script th:inline="javascript">
        /*<![CDATA[*/
        const isEdit = /*[[${isEdit}]]*/ false;
        const articleId = /*[[${article.id}]]*/ null;

        function updateLivePreview() {
            const raw = document.getElementById('article-content').value;
            const previewEl = document.getElementById('editor-preview');
            if (raw && window.marked) {
                previewEl.innerHTML = marked.parse(raw);
            } else {
                previewEl.innerHTML = '<p style="color: var(--text-muted);">Start writing on the left to see the live rendering here...</p>';
            }
        }

        async function uploadCoverImage(input) {
            if (!input.files || input.files.length === 0) return;
            const file = input.files[0];
            const formData = new FormData();
            formData.append('file', file);
            formData.append('folder', 'covers');

            App.showToast('Uploading cover image...');
            try {
                const res = await App.api('/api/v1/media/upload', {
                    method: 'POST',
                    body: formData
                });
                if (res.ok) {
                    const data = await res.json();
                    document.getElementById('article-coverUrl').value = data.url;
                    App.showToast('Cover image uploaded successfully!');
                } else {
                    App.showToast('Failed to upload image', 'error');
                }
            } catch (e) {
                App.showToast('Upload error', 'error');
            }
        }

        async function saveArticle(status) {
            const title = document.getElementById('article-title').value.trim();
            const content = document.getElementById('article-content').value.trim();
            const shortDesc = document.getElementById('article-shortDesc').value.trim();
            const categoryId = document.getElementById('article-category').value;
            const coverImageUrl = document.getElementById('article-coverUrl').value.trim();
            const tagsInput = document.getElementById('article-tags').value;

            if (!title) {
                App.showToast('Please enter an article title', 'error');
                return;
            }
            if (!content) {
                App.showToast('Please write some content', 'error');
                return;
            }

            const tags = tagsInput.split(',')
                .map(t => t.trim())
                .filter(t => t.length > 0);

            const payload = {
                title,
                content,
                shortDesc,
                categoryId: categoryId ? parseInt(categoryId) : null,
                coverImageUrl: coverImageUrl || null,
                tags,
                status: status
            };

            const endpoint = isEdit ? `/api/v1/articles/${articleId}` : '/api/v1/articles/create';
            const method = isEdit ? 'PUT' : 'POST';

            try {
                const res = await App.api(endpoint, {
                    method,
                    body: JSON.stringify(payload)
                });

                if (res.ok) {
                    const saved = await res.json();
                    App.showToast(status === 'PUBLISHED' ? 'Story published!' : 'Draft saved!');
                    setTimeout(() => {
                        window.location.href = `/articles/${saved.slug || saved.id}`;
                    }, 800);
                } else {
                    const err = await res.json();
                    App.showToast(err.message || 'Error saving story', 'error');
                }
            } catch (e) {
                App.showToast('Failed to save article', 'error');
            }
        }

        document.addEventListener('DOMContentLoaded', () => {
            updateLivePreview();
        });
        /*]]>*/
    </script>
</body>
</html>
