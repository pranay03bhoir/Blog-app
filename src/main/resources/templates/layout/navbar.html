<!DOCTYPE html>
<html xmlns:th="http://www.thymeleaf.org">
<body>
<nav class="navbar" th:fragment="navbar">
    <div class="container nav-container">
        <a href="/" class="brand">
            <div class="brand-icon">B</div>
            <span>BlogApp</span>
            <span class="brand-badge">Pro</span>
        </a>

        <!-- Desktop Search Bar -->
        <form action="/search" method="GET" class="nav-search nav-search-desktop">
            <span class="nav-search-icon">🔍</span>
            <input type="text" name="q" placeholder="Search stories, topics, engineering guides..." th:value="${query}" />
        </form>

        <!-- Desktop Navigation Items -->
        <div class="nav-links nav-links-desktop">
            <a href="/" class="nav-link">Home</a>
            <a href="/swagger-ui.html" target="_blank" class="nav-link" title="OpenAPI REST API Docs">API Docs</a>
            
            <div id="auth-nav-items" class="auth-nav-items">
                <!-- Filled dynamically by app.js based on JWT -->
                <a href="/login" class="nav-link">Sign In</a>
                <a href="/register" class="btn btn-primary btn-sm">Get Started</a>
            </div>
        </div>

        <!-- Mobile Controls (Search Toggle + Animated Hamburger) -->
        <div class="mobile-nav-controls">
            <button type="button" class="mobile-nav-btn" id="mobile-search-toggle" aria-label="Search stories">
                <svg width="18" height="18" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round" viewBox="0 0 24 24">
                    <circle cx="11" cy="11" r="8"></circle>
                    <line x1="21" y1="21" x2="16.65" y2="16.65"></line>
                </svg>
            </button>
            <button type="button" class="mobile-nav-btn hamburger-btn" id="mobile-menu-toggle" aria-label="Toggle navigation menu" aria-expanded="false">
                <span class="hamburger-line"></span>
                <span class="hamburger-line"></span>
                <span class="hamburger-line"></span>
            </button>
        </div>
    </div>

    <!-- Mobile Collapsible Search Drawer -->
    <div class="mobile-search-drawer" id="mobile-search-drawer">
        <div class="container">
            <form action="/search" method="GET" class="mobile-search-form">
                <span class="nav-search-icon">🔍</span>
                <input type="text" name="q" placeholder="Search stories, topics..." th:value="${query}" />
                <button type="submit" class="btn btn-primary btn-sm">Search</button>
            </form>
        </div>
    </div>

    <!-- Mobile Navigation Drawer -->
    <div class="mobile-menu-drawer" id="mobile-menu-drawer">
        <div class="container mobile-menu-content">
            <div class="mobile-nav-links">
                <a href="/" class="mobile-nav-link">
                    <span class="mobile-nav-icon">🏠</span>
                    <span>Home</span>
                </a>
                <a href="/swagger-ui.html" target="_blank" class="mobile-nav-link">
                    <span class="mobile-nav-icon">⚡</span>
                    <span>API Docs</span>
                </a>
            </div>
            <div id="mobile-auth-nav-items" class="mobile-auth-nav-items">
                <!-- Filled dynamically by app.js -->
            </div>
        </div>
    </div>
</nav>
</body>
</html>
