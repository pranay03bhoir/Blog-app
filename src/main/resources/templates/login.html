<!DOCTYPE html>
<html xmlns:th="http://www.thymeleaf.org">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Sign In - BlogApp Pro</title>
    <link rel="preconnect" href="https://fonts.googleapis.com">
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
    <link href="https://fonts.googleapis.com/css2?family=Plus+Jakarta+Sans:wght@400;500;600;700;800&family=JetBrains+Mono:wght@400;500&display=swap" rel="stylesheet">
    <link rel="icon" type="image/svg+xml" th:href="@{/favicon.svg}">
    <link rel="alternate icon" th:href="@{/favicon.ico}">
    <link rel="stylesheet" th:href="@{/css/style.css}">
</head>
<body>

    <div th:replace="~{layout/navbar :: navbar}"></div>

    <main class="main-content">
        <div class="container">

            <div class="form-card">
                <div style="text-align: center; margin-bottom: 2rem;">
                    <div class="brand-icon" style="margin: 0 auto 1rem auto; width: 44px; height: 44px; font-size: 1.3rem;">B</div>
                    <h1 style="font-size: 1.75rem; margin-bottom: 0.5rem;">Welcome Back</h1>
                    <p style="color: var(--text-secondary); font-size: 0.9rem;">Sign in to your BlogApp account</p>
                </div>

                <form id="login-form" onsubmit="handleLogin(event)">
                    <div class="form-group">
                        <label class="form-label">Email Address</label>
                        <input type="email" id="login-email" class="form-input" placeholder="you@example.com" required />
                    </div>

                    <div class="form-group">
                        <label class="form-label">Password</label>
                        <input type="password" id="login-password" class="form-input" placeholder="••••••••" required />
                    </div>

                    <button type="submit" class="btn btn-primary" style="width: 100%; margin-top: 1rem; padding: 0.75rem;">Sign In</button>
                </form>

                <div style="margin-top: 1.5rem; text-align: center; font-size: 0.88rem; color: var(--text-muted);">
                    Don't have an account? <a href="/register" style="color: #60a5fa; font-weight: 600;">Create one</a>
                </div>

                <!-- Demo Login Shortcut -->
                <div style="margin-top: 1.5rem; padding-top: 1rem; border-top: 1px solid var(--border-color); font-size: 0.8rem; color: var(--text-muted); text-align: center;">
                    <span>Demo Accounts:</span><br>
                    <a href="javascript:void(0)" onclick="fillDemo('admin@blogapp.com', 'admin123')" style="color: #60a5fa;">Admin (admin@blogapp.com)</a> | 
                    <a href="javascript:void(0)" onclick="fillDemo('alex@blogapp.com', 'alex123')" style="color: #60a5fa;">Author (alex@blogapp.com)</a>
                </div>
            </div>

        </div>
    </main>

    <div th:replace="~{layout/footer :: footer}"></div>

    <script th:src="@{/js/app.js}"></script>
    <script>
        function fillDemo(email, pass) {
            document.getElementById('login-email').value = email;
            document.getElementById('login-password').value = pass;
        }

        async function handleLogin(e) {
            e.preventDefault();
            const email = document.getElementById('login-email').value.trim();
            const password = document.getElementById('login-password').value;

            try {
                const res = await fetch('/api/v1/auth/login', {
                    method: 'POST',
                    headers: { 'Content-Type': 'application/json' },
                    body: JSON.stringify({ email, password })
                });

                if (res.ok) {
                    const data = await res.json();
                    App.setToken(data.token);
                    App.setUser(data.user);
                    App.showToast('Login successful!');
                    setTimeout(() => {
                        window.location.href = '/dashboard';
                    }, 500);
                } else {
                    const err = await res.json();
                    App.showToast(err.message || 'Invalid credentials', 'error');
                }
            } catch (err) {
                App.showToast('Network error during login', 'error');
            }
        }
    </script>
</body>
</html>
