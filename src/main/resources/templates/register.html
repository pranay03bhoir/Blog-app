<!DOCTYPE html>
<html xmlns:th="http://www.thymeleaf.org">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=5.0">
    <title>Create Account - BlogApp Pro</title>
    <link rel="preconnect" href="https://fonts.googleapis.com">
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
    <link href="https://fonts.googleapis.com/css2?family=Plus+Jakarta+Sans:wght@400;500;600;700;800&family=JetBrains+Mono:wght@400;500&display=swap" rel="stylesheet">
    <link rel="icon" type="image/svg+xml" th:href="@{/favicon.svg}">
    <link rel="alternate icon" th:href="@{/favicon.ico}">
    <link rel="stylesheet" th:href="@{/css/style.css}">
</head>
<body>

    <div th:replace="~{layout/navbar :: navbar}"></div>

    <main class="main-content">
        <div class="container">

            <div class="form-card">
                <div style="text-align: center; margin-bottom: 2rem;">
                    <div class="brand-icon" style="margin: 0 auto 1rem auto; width: 44px; height: 44px; font-size: 1.3rem;">B</div>
                    <h1 style="font-size: clamp(1.4rem, 4vw, 1.75rem); margin-bottom: 0.5rem;">Join the Community</h1>
                    <p style="color: var(--text-secondary); font-size: 0.9rem;">Share your knowledge with thousands of developers</p>
                </div>

                <form id="register-form" onsubmit="handleRegister(event)">
                    <div class="form-group">
                        <label class="form-label">Full Name *</label>
                        <input type="text" id="reg-name" class="form-input" placeholder="e.g. Jane Doe" required />
                    </div>

                    <div class="form-group">
                        <label class="form-label">Email Address *</label>
                        <input type="email" id="reg-email" class="form-input" placeholder="you@example.com" required />
                    </div>

                    <div class="form-group">
                        <label class="form-label">Password * (min 6 chars)</label>
                        <input type="password" id="reg-password" class="form-input" placeholder="••••••••" minlength="6" required />
                    </div>

                    <div class="form-group">
                        <label class="form-label">Tagline (Optional)</label>
                        <input type="text" id="reg-tagline" class="form-input" placeholder="e.g. Cloud Engineer & Open Source Builder" />
                    </div>

                    <div class="form-group">
                        <label class="form-label">Short Bio (Optional)</label>
                        <textarea id="reg-bio" class="form-input" style="min-height: 70px;" placeholder="Tell readers about yourself..."></textarea>
                    </div>

                    <button type="submit" class="btn btn-primary" style="width: 100%; margin-top: 1rem; padding: 0.75rem;">Create Account</button>
                </form>

                <div style="margin-top: 1.5rem; text-align: center; font-size: 0.88rem; color: var(--text-muted);">
                    Already have an account? <a href="/login" style="color: #60a5fa; font-weight: 600;">Sign in</a>
                </div>
            </div>

        </div>
    </main>

    <div th:replace="~{layout/footer :: footer}"></div>

    <script th:src="@{/js/app.js}"></script>
    <script>
        async function handleRegister(e) {
            e.preventDefault();
            const name = document.getElementById('reg-name').value.trim();
            const email = document.getElementById('reg-email').value.trim();
            const password = document.getElementById('reg-password').value;
            const tagline = document.getElementById('reg-tagline').value.trim();
            const bio = document.getElementById('reg-bio').value.trim();

            try {
                const res = await fetch('/api/v1/auth/register', {
                    method: 'POST',
                    headers: { 'Content-Type': 'application/json' },
                    body: JSON.stringify({ name, email, password, tagline, bio })
                });

                if (res.ok) {
                    App.showToast('Account created successfully! Signing in...');
                    // Auto login
                    const loginRes = await fetch('/api/v1/auth/login', {
                        method: 'POST',
                        headers: { 'Content-Type': 'application/json' },
                        body: JSON.stringify({ email, password })
                    });
                    if (loginRes.ok) {
                        const data = await loginRes.json();
                        App.setToken(data.token);
                        App.setUser(data.user);
                        setTimeout(() => window.location.href = '/dashboard', 600);
                    } else {
                        setTimeout(() => window.location.href = '/login', 800);
                    }
                } else {
                    const err = await res.json();
                    App.showToast(err.message || 'Registration failed', 'error');
                }
            } catch (err) {
                App.showToast('Network error during registration', 'error');
            }
        }
    </script>
</body>
</html>
